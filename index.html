<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="伯恩主屋" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="伯恩主屋版 · 长期记忆系统" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f4f1ec" />
    <script>
      // 首帧前预热：按上次主题设好 data-theme 与 theme-color，避免顶部白闪
      (function () {
        try {
          var raw = localStorage.getItem('burne-home-core:theme')
          var id = raw ? JSON.parse(raw).id : 'aurora'
          if (['sage', 'aurora', 'ink'].indexOf(id) < 0) id = 'aurora'
          document.documentElement.dataset.theme = id
          var bar = { sage: '#f4f1ec', aurora: '#f4f1ec', ink: '#f4f1ec' }[id]
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', bar)
        } catch (e) {}
      })()
      // 装机版（PWA standalone）冷启动时回到主页，避免每次都停在上次的聊天页
      ;(function () {
        try {
          var standalone =
            window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
          if (standalone && !sessionStorage.getItem('bw-launched')) {
            sessionStorage.setItem('bw-launched', '1')
            if (location.hash && location.hash !== '#/') location.hash = '#/'
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <title>伯恩主屋 · 长期记忆</title>
    <style>
      /* 启动闪屏：冷启动从网络加载主程序时，先显示这片奶白 + 呼吸的 BW♡，
         避免一片空白「像没打开」；React 挂载后会替换 #root 内容自动消失。 */
      #bw-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f1ec;
      }
      #bw-splash .bw-mark {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-size: 34px;
        letter-spacing: 0.02em;
        color: #cf8aa6;
        animation: bw-breathe 1.6s ease-in-out infinite;
      }
      @keyframes bw-breathe {
        0%, 100% { opacity: 0.45; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="bw-splash"><div class="bw-mark">BW ♡</div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
