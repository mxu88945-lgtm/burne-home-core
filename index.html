<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="伯恩主屋" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="伯恩主屋版 · 长期记忆系统" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f6ebe8" />
    <script>
      // 首帧前预热：按上次主题设好 data-theme 与 theme-color，避免顶部白闪
      (function () {
        try {
          var raw = localStorage.getItem('burne-home-core:theme')
          var id = raw ? JSON.parse(raw).id : 'mist'
          if (['mist', 'sage', 'aurora', 'dusk', 'ink'].indexOf(id) < 0) id = 'mist'
          document.documentElement.dataset.theme = id
          var bar = { mist: '#f6ebe8', sage: '#e9f0ec', aurora: '#eceaf4', dusk: '#2c2724', ink: '#f4f3f0' }[id]
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', bar)
        } catch (e) {}
      })()
      // 装机版（PWA standalone）冷启动时回到主页，避免每次都停在上次的聊天页
      ;(function () {
        try {
          var standalone =
            window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
          if (standalone && !sessionStorage.getItem('bw-launched')) {
            sessionStorage.setItem('bw-launched', '1')
            if (location.hash && location.hash !== '#/') location.hash = '#/'
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <title>伯恩主屋 · 长期记忆</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
